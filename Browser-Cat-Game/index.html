
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Cat Fish Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #062f4f;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #credits {
            text-align: center;
            padding: 8px;
            background: #062f4f;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        #credits a {
            color: white;
        }
    </style>
</head>

<body>
    <canvas id="game"></canvas>
    <footer id = "credits">
        <a href="https://nszym.itch.io/spearfishing-assets-pack">fish assets made by Szym </a>
    </footer>
    <script src="game.js"></script>
</body>
</html>
